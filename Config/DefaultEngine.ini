[SystemSettings]
; Lumen surface cache: meshes under 1 m (barrier tyres, kart parts, fence posts) stay out of the card capture.
; Measured 2026-11-19 (1080p, RTX 4070 SUPER): frame median 14.5 -> 7.2 ms, p99 23 -> 8.6 ms. They are still lit.
r.LumenScene.SurfaceCache.MeshCardsMinSize=100
; Physical daylight (90 klx sun) runs at ~EV 13: the default cached-lighting pre-exposure (4, safe up to EV 12) clipped
; Lumen's cached lighting and the real-time sky capture (on-screen warning in Development builds). 8 covers EV -4..16.
r.EyeAdaptation.CachedLightingPreExposure=8
